# Run Scriptorium with every tool installed:
#   docker compose build
#   docker compose run --rm scriptorium doctor
#   docker compose run --rm scriptorium make stories/foo.json --only story
# The checkout is mounted at /app: stories, contexts, runs and .env stay on
# your machine. See README "Run with Docker".
services:
  scriptorium:
    build: .
    image: scriptorium
    # Files written to runs/ belong to you (export UID and GID if yours aren't 1000).
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app:z
      - /app/node_modules     # hide a host node_modules: the image's own are used
      - cache:/cache          # the Kokoro voice model and Gemini voice library, downloaded once
volumes:
  cache:
